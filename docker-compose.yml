services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uptime_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/monitor.db
      - CHECK_INTERVAL_SECONDS=60
      - CHECK_TIMEOUT_SECONDS=5.0
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uptime_frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  sqlite_data:
    driver: local
